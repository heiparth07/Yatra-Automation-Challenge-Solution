name: Yatra Selenium Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows the live UI suite to be run on demand

jobs:
  # ---------------------------------------------------------------------------
  # Runs on every push / PR: a fast, deterministic check that the project
  # compiles and the test sources are valid. No browser, no network, no flake.
  # ---------------------------------------------------------------------------
  build:
    name: Build & compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Compile main + test sources
        run: mvn -B clean test-compile

  # ---------------------------------------------------------------------------
  # The full Selenium suite drives the LIVE yatra.com site, which applies
  # bot protection and region-dependent rendering. That makes it unreliable
  # on hosted CI runners (datacenter IPs / headless), so it is NOT gated on
  # every push — it is run on demand via the "Run workflow" button.
  # ---------------------------------------------------------------------------
  live-ui-tests:
    name: Live UI regression (on-demand)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run TestNG suite (headless)
        run: mvn -B test -Dheadless=true

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
